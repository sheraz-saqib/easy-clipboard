name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        run: |
          [[ "$GITHUB_REF_TYPE" == tag ]] && export VERSION="${GITHUB_REF_NAME#[vV]}"
          ./build.sh dmg

      - name: Checksum
        run: cd build && shasum -a 256 EasyClipboard.dmg > EasyClipboard.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: EasyClipboard
          path: build/EasyClipboard.dmg*

      # Asset name must stay EasyClipboard.dmg: README links releases/latest/download/EasyClipboard.dmg
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="build/EasyClipboard.dmg build/EasyClipboard.dmg.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files \
              --title "Easy Clipboard $GITHUB_REF_NAME" --generate-notes
          fi
